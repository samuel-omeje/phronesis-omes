<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1100" height="250" viewBox="0 0 1100 250"
     role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Phronesis Omes</title>
  <desc id="logoDesc">The gold P and house emblem beside the Phronesis Omes name, set horizontally in matching gold.</desc>
  <defs>
    <linearGradient id="brandGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE297"/>
      <stop offset="50%" stop-color="#D4A53A"/>
      <stop offset="100%" stop-color="#A06C18"/>
    </linearGradient>
  </defs>
  <image x="18" y="20" width="225" height="205"
         xlink:href="data:image/png;base64,"
         preserveAspectRatio="xMidYMid meet"/>
  <text x="275" y="151"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="76" font-weight="700"
        letter-spacing="1.2"
        fill="url(#brandGold)">PHRONESIS OMES</text>
</svg>
